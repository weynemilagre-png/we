  if (!D.live) return '';
  const lgs = D.live.leagues;
  const allUp = lgs.flatMap(l => l.upcoming.map(u => Object.assign({ lgn: l.name }, u))).filter(u => Date.parse(u.t) > Date.now() - 2 * 3600e3).sort((a, b) => a.t.localeCompare(b.t));
  const next = allUp[0];
  const recent = lgs.flatMap(l => l.games).sort((a, b) => b.t.localeCompare(a.t)).slice(0, 3);
  return `<section class="sec"><div class="sec-h"><h2>Agora</h2><span class="xs muted">actualizado ${liveUpdated()}</span></div>
  <div class="card tight" style="gap:4px"><span class="eyebrow" style="padding:4px 2px 0">Moçambicanos na Europa</span><div class="list">${spotlightHtml()}</div></div>
  <div class="card tight" style="gap:0"><span class="eyebrow" style="padding:4px 4px 0">Últimos resultados</span>${recent.map(g => liveRow(g, true)).join('')}</div>
  ${next ? `<div class="card tight"><span class="eyebrow">A seguir · ${esc(next.lgn)}</span>${upcomingRows([next], 1)}</div>` : ''}
  <a class="btn" href="#agora" style="align-self:flex-start">Todos os jogos desta semana ${ic('chev')}</a></section>`;
}
function liveNote() {
  return `<div class="note">Dados actuais recolhidos pelo Claude (${esc(D.live.source.replace(', recolhido pelo Claude', ''))}) a ${liveUpdated()}. A app em si não vai à internet. Esta fonte traz resultados e estatísticas de equipa, mas não traz dados por jogador, xG nem posições. Por isso não há notas de jogadores nem mapas nestes jogos.</div>`;
}
function viewLive() {
  setTop();
  if (!D.live) { V.innerHTML = `<div class="card"><h2>Sem dados actuais</h2><p class="small muted">O ficheiro de jogos actuais não está disponível.</p></div>`; return; }
  CUR.ctx = { type: 'live' };
  V.innerHTML = `<div class="sec"><h1>Agora</h1><p class="muted small">Futebol desta semana: resultados, leitura dos jogos e próximos jogos.</p></div>
  <div class="chips"><button class="chip" type="button" aria-pressed="true">Agora · 2026/27</button>${D.ix.comps.map(c => `<button class="chip" type="button" data-act="mf-comp-go" data-v="${c.key}" aria-pressed="false">${c.name}</button>`).join('')}</div>
  ${liveNote()}
  <section class="sec"><h2>Moçambicanos na Europa</h2><div class="card tight"><div class="list">${spotlightHtml()}</div></div></section>
  ${D.live.leagues.map(l => `<section class="sec"><div class="sec-h"><h2>${esc(l.name)}</h2><span class="xs muted">${esc(l.season)}</span></div>
    <div class="card tight" style="gap:0"><span class="eyebrow" style="padding:4px 4px 0">${esc(l.label)}</span>${l.games.map(g => liveRow(g, true)).join('')}${(l.results || []).map(r => liveRow(r, false)).join('')}</div>
    <div class="card tight" style="gap:0"><div class="row" style="padding:4px 2px"><span class="eyebrow grow">Próximos jogos</span>${tag('e')}</div>${upcomingRows(l.upcoming)}
    <p class="caption" style="padding-top:8px">Probabilidades calculadas pelo fornecedor de dados. 56% quer dizer que, em 100 jogos assim, essa equipa ganharia cerca de 56. Não é uma previsão certa, e a app não tem apostas.</p></div></section>`).join('')}
  ${feedbackBox('agora', 'Esta área de jogos actuais é útil?')}`;
}
ACT['mf-comp-go'] = el => { MF.comp = el.dataset.v; MF.team = ''; MF.stage = ''; S.comp = el.dataset.v; save(); location.hash = '#jogos'; };
function viewLiveMatch(id) {
  if (!D.live || !D.liveGame[id]) { V.innerHTML = errBox(new Error('Jogo não encontrado nos dados actuais.')); return; }
  const g = D.liveGame[id], H = lname(g.h), A = lname(g.a), S = g.ts;
  CUR.ctx = { type: 'livematch', id }; CUR.lg = g;
  setTop({ title: `${g.h} ${g.hg}–${g.ag} ${g.a}` });
  remember({ h: 'ao-vivo-' + id, t: `${H} ${g.hg}–${g.ag} ${A} · ${g.lg.name}` });
  const w = g.hg > g.ag ? 'h' : g.ag > g.hg ? 'a' : null;
  const tl = g.ev.map(e => {
    const icon = e[1] === 'g' ? ic('ball', 'ico') : e[1] === 'r' ? '<span class="rcard" aria-label="Vermelho"></span>' : '<span class="ycard" aria-label="Amarelo"></span>';
    const txt = e[1] === 'g' ? '<b>Golo</b>' : e[1] === 'r' ? 'Vermelho' : 'Amarelo';
    return `<div class="tl-r"><span class="l">${e[2] === 'h' ? txt + icon : ''}</span><span class="m">${e[0]}'</span><span class="rr">${e[2] === 'a' ? icon + txt : ''}</span></div>`;
  }).join('');
  const story = liveStory(g);
  const lostWithBall = w && S[w].poss < S[w === 'h' ? 'a' : 'h'].poss - 9;
  const blocked = Math.max(S.h.blk, S.a.blk) >= 7;
  const mod = lostWithBall ? MODULES.find(m => m.id === 'transicoes') : blocked ? MODULES.find(m => m.id === 'largura') : MODULES.find(m => m.id === 'xg');
  const why = lostWithBall ? 'Porque é que ter a bola nem sempre chega' : blocked ? 'Como abrir uma defesa fechada' : 'Nem todos os remates valem o mesmo';
  V.innerHTML = `<section class="card">
    <div class="row xs muted" style="justify-content:center;text-align:center">${esc(g.lg.name)} ${esc(g.lg.season)} · ${relDay(g.t)}</div>
    <div class="board"><div class="t">${lchip(g.h)}<span class="${w === 'a' ? 'muted' : ''}">${esc(H)}</span></div><div class="s">${g.hg}<span class="dash">–</span>${g.ag}</div><div class="t">${lchip(g.a)}<span class="${w === 'h' ? 'muted' : ''}">${esc(A)}</span></div></div>
    <div class="row wrap" style="justify-content:center">${tag('f')}<span class="xs muted">Dados actuais · estatísticas de equipa</span></div></section>
  ${g.note ? `<div class="note acc"><b>${esc(g.note[1])}</b> (Mambas) está na ficha de jogo de ${esc(lname(g.note[0]))}.</div>` : ''}
  <section class="sec"><div class="sec-h"><h2>Leitura do jogo</h2><span class="xs muted">análise automática</span></div><div class="card">${storyList(story)}<p class="caption">Leitura feita a partir das estatísticas de equipa. Sem dados de cada jogada, as causas ficam por confirmar.</p></div></section>
  <section class="sec"><h2>Momentos</h2><div class="card tight"><div class="row xs muted"><span class="grow">${esc(H)}</span><span>${esc(A)}</span></div><div class="tl">${tl}</div><p class="caption">Esta fonte indica o minuto dos golos e dos cartões, mas não o jogador.</p></div></section>
  <section class="sec"><h2>Números do jogo</h2><div class="card"><div class="row xs muted"><span class="grow">${lchip(g.h)}</span>${lchip(g.a)}</div><div class="cmp">
    ${cmpRow(`Posse de bola`, S.h.poss, S.a.poss, 0, '%')}${cmpRow('Remates', S.h.shots, S.a.shots)}${cmpRow('Remates enquadrados', S.h.sot, S.a.sot)}${cmpRow('Remates bloqueados', S.h.blk, S.a.blk, 0, '', true)}${cmpRow('Remates para fora', S.h.off, S.a.off, 0, '', true)}${cmpRow('Cantos', S.h.corners, S.a.corners)}${cmpRow('Faltas', S.h.fouls, S.a.fouls, 0, '', true)}${cmpRow('Foras de jogo', S.h.offsides, S.a.offsides, 0, '', true)}${cmpRow('Cartões amarelos', S.h.yc, S.a.yc, 0, '', true)}
  </div></div></section>
  <section class="sec"><h2>O que estes dados não mostram</h2><div class="card"><p class="small">Sem dados de cada jogada não dá para dar nota aos jogadores, desenhar mapas nem calcular golos esperados (xG). Nos jogos do CAN 2023 e do Euro 2024 desta app isso existe porque esses dados são evento a evento.</p><a class="btn sm" href="#analise-3920410-10848" style="align-self:flex-start">Ver como seria: Reinildo contra o Gana</a></div></section>
  ${mod ? `<a class="card link tight" href="#modulo-${mod.id}"><div class="row"><div class="grow"><span class="eyebrow">Aprender com este jogo</span><div class="li-t">${why}</div><div class="li-s">${esc(mod.title)}</div></div>${ic('chev', 'ico')}</div></a>` : ''}
  ${feedbackBox('ao-vivo-' + id, 'Esta leitura do jogo foi útil?')}`;
}

/* ============================== arranque ============================== */
(async function boot() {
  applyLook();
  renderNav('inicio');
  setTop();
  const fab = $('#fab');
  fab.innerHTML = ic('ask') + '<span>Perguntar</span>';
  fab.addEventListener('click', () => { if (D.ix) openAsk(); });
  try { await loadIndex(); } catch (e) { V.innerHTML = errBox(e); return; }
  await loadLive();
  route();
})();

</script>
<script>
/* Guarda a app no telemóvel para abrir sem internet. */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
