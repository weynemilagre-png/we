/* Plano: coluna de telemóvel com navegação inferior; o campo é o elemento-assinatura;
   números em letra condensada de placard; etiquetas que distinguem facto, estimativa e interpretação. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E9EEF3; --line:#D3DCE5; --text:#0C1A29; --muted:#566779;
  --accent:#4F7A12; --accent-ink:#FFFFFF; --accent-soft:#E6F1D3;
  --pos:#0E7A4E; --info:#1F5FCC; --warn:#9A5800; --neg:#BF3128;
  --pos-soft:#DDF3E8; --info-soft:#E0EAFB; --warn-soft:#FBEBD3; --neg-soft:#F8DEDB;
  --home:#4F7A12; --away:#1F5FCC;
  --pitch:#E1ECE4; --pitch-line:#93B19D; --heat:79,122,18; --shadow:0 1px 2px rgba(12,26,41,.06),0 4px 14px rgba(12,26,41,.05);
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --body:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:14px; --r-sm:10px; --fs:16px;
  color-scheme:light;
}
:root[data-app="dark"]{
  --bg:#07111C; --surface:#0E1C2B; --surface-2:#14283C; --line:#203750; --text:#E7EEF6; --muted:#8EA2B7;
  --accent:#A6E33A; --accent-ink:#0A1606; --accent-soft:rgba(166,227,58,.13);
  --pos:#3DD39B; --info:#69A8FF; --warn:#F8BE3C; --neg:#FF7A72;
  --pos-soft:rgba(61,211,155,.13); --info-soft:rgba(105,168,255,.13); --warn-soft:rgba(248,190,60,.13); --neg-soft:rgba(255,122,114,.13);
  --home:#A6E33A; --away:#69A8FF;
  --pitch:#0B2620; --pitch-line:#2C5848; --heat:166,227,58; --shadow:0 1px 0 rgba(255,255,255,.02),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root[data-app="auto"]:not([data-theme="light"]){
    --bg:#07111C; --surface:#0E1C2B; --surface-2:#14283C; --line:#203750; --text:#E7EEF6; --muted:#8EA2B7;
    --accent:#A6E33A; --accent-ink:#0A1606; --accent-soft:rgba(166,227,58,.13);
    --pos:#3DD39B; --info:#69A8FF; --warn:#F8BE3C; --neg:#FF7A72;
    --pos-soft:rgba(61,211,155,.13); --info-soft:rgba(105,168,255,.13); --warn-soft:rgba(248,190,60,.13); --neg-soft:rgba(255,122,114,.13);
    --home:#A6E33A; --away:#69A8FF; --pitch:#0B2620; --pitch-line:#2C5848; --heat:166,227,58;
    --shadow:0 1px 0 rgba(255,255,255,.02),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-app="auto"][data-theme="dark"]{
  --bg:#07111C; --surface:#0E1C2B; --surface-2:#14283C; --line:#203750; --text:#E7EEF6; --muted:#8EA2B7;
  --accent:#A6E33A; --accent-ink:#0A1606; --accent-soft:rgba(166,227,58,.13);
  --pos:#3DD39B; --info:#69A8FF; --warn:#F8BE3C; --neg:#FF7A72;
  --pos-soft:rgba(61,211,155,.13); --info-soft:rgba(105,168,255,.13); --warn-soft:rgba(248,190,60,.13); --neg-soft:rgba(255,122,114,.13);
  --home:#A6E33A; --away:#69A8FF; --pitch:#0B2620; --pitch-line:#2C5848; --heat:166,227,58;
  --shadow:0 1px 0 rgba(255,255,255,.02),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:1.9rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
.num,.tab-num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ------- estrutura ------- */
.shell{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px}
.brand{color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.06em;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.9rem;letter-spacing:0}
.brand b{color:var(--accent);font-weight:700}
.top-title{font-family:var(--display);font-weight:700;font-size:1.2rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.lvl i{font-style:normal;color:var(--accent)}
main{flex:1;padding:16px 16px 150px;display:flex;flex-direction:column;gap:18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600;border-radius:10px}
.nav a svg{width:23px;height:23px}
.nav a[aria-current="page"]{color:var(--text)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 324px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 16px 12px 13px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.95rem;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer}
.fab svg{width:21px;height:21px}

/* ------- blocos ------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none}
.card.tight{padding:12px}
.card.link{cursor:pointer;text-decoration:none;color:inherit}
.card.link:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.sec-h h2{font-size:1.25rem}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.xs{font-size:.76rem}
.lead{font-size:1.02rem}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr{height:1px;background:var(--line);border:0;margin:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;font-size:.92rem}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:.84rem;border-radius:8px}
.btn svg{width:18px;height:18px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:10px 12px;font-weight:700;font-size:.95rem;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px 11px 40px;font-size:1rem}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted)}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:600;font-size:.9rem;max-width:100%}
.note{border-left:3px solid var(--info);background:var(--info-soft);padding:10px 12px;border-radius:0 10px 10px 0;font-size:.9rem}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.acc{border-color:var(--accent);background:var(--accent-soft)}

/* equipas, notas, etiquetas */
.tchip{display:inline-grid;place-items:center;min-width:38px;height:22px;padding:0 6px;border-radius:6px;font-family:var(--display);font-weight:700;font-size:.82rem;letter-spacing:.04em;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.rt{display:inline-grid;place-items:center;min-width:38px;height:26px;padding:0 7px;border-radius:7px;font-family:var(--display);font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums;color:#06121d}
.rt.big{min-width:64px;height:48px;font-size:1.75rem;border-radius:12px}
.rt.b5{background:#2FC48D}.rt.b4{background:#7FD16B}.rt.b3{background:#9CC3F0}.rt.b2{background:#F2C14E}.rt.b1{background:#F2867D}.rt.b0{background:var(--surface-2);color:var(--muted);font-size:.8rem}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px 2px 6px;border-radius:5px;white-space:nowrap;vertical-align:1px}
.tag::before{content:"";width:7px;height:7px;display:inline-block}
.tag.f{color:var(--info);background:var(--info-soft)} .tag.f::before{background:var(--info)}
.tag.e{color:var(--accent);background:var(--accent-soft)} .tag.e::before{background:var(--accent);border-radius:50%}
.tag.i{color:var(--muted);background:var(--surface-2)} .tag.i::before{background:var(--muted);transform:rotate(45deg) scale(.85)}
.tag.h{color:var(--warn);background:var(--warn-soft)} .tag.h::before{border:1.5px dashed var(--warn);border-radius:50%;width:6px;height:6px}
:root:not([data-app="dark"]) .tag.e{color:#3E6410}
.story{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.story li{display:flex;flex-direction:column;gap:4px}
.story li p{font-size:1rem}

/* listas */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer;min-width:0}
.li:last-child{border-bottom:0}
.li:hover .li-t{text-decoration:underline;text-decoration-color:var(--line)}
.li-t{font-weight:600}
.li-s{font-size:.82rem;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-decoration:none;color:inherit;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.match:last-child{border-bottom:0}
.match .tm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.match .tm.r{justify-content:flex-end;text-align:right}
.match .sc{font-family:var(--display);font-weight:700;font-size:1.45rem;text-align:center;font-variant-numeric:tabular-nums;min-width:64px;line-height:1}
.match .sc small{display:block;font-family:var(--body);font-size:.7rem;font-weight:600;color:var(--muted);margin-top:3px;letter-spacing:0}
.match .win{font-weight:700}
.daygrp{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding-top:8px}

/* placard do jogo */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.board .t{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;min-width:0}
.board .t .tchip{min-width:48px;height:28px;font-size:1rem}
.board .s{font-family:var(--display);font-size:2.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.board .s .dash{color:var(--muted);margin:0 4px}

/* barras de comparação */
.cmp{display:flex;flex-direction:column;gap:9px}
.cmp-r{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px}
.cmp-r .v{font-family:var(--display);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.cmp-r .v.r{text-align:right}
.cmp-r .mid{display:flex;flex-direction:column;gap:4px}
.cmp-r .lab{font-size:.8rem;color:var(--muted);text-align:center;font-weight:600}
.cmp-bar{display:flex;height:7px;gap:3px}
.cmp-bar span{display:block;height:100%;border-radius:4px}
.cmp-bar .h{background:var(--home)} .cmp-bar .a{background:var(--away)}

/* percentis */
.pct{display:flex;flex-direction:column;gap:10px}
.pct-r{display:flex;flex-direction:column;gap:4px}
.pct-top{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.pct-top b{font-family:var(--display);font-size:1rem;font-variant-numeric:tabular-nums}
.pct-track{position:relative;height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.pct-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.pct-mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.6}

/* gráficos */
.fig{display:flex;flex-direction:column;gap:8px;min-width:0}
.fig > svg,svg.chart{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.caption{font-size:.84rem;color:var(--muted)}
.ax{fill:var(--muted);font-size:9px;font-family:var(--body)}
.pitch-bg{fill:var(--pitch)}
.pl{fill:none;stroke:var(--pitch-line);stroke-width:.5}
.wf-row{cursor:pointer}
.wf-row:hover rect.bg{fill:var(--surface-2)}

/* factores */
.fac{display:flex;flex-direction:column;gap:0}
.fac details{border-bottom:1px solid var(--line)}
.fac details:last-child{border-bottom:0}
.fac summary{list-style:none;display:grid;grid-template-columns:1fr 120px 46px;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
.fac summary::-webkit-details-marker{display:none}
.fac .bar{position:relative;height:10px;background:var(--surface-2);border-radius:5px}
.fac .bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.fac .bar .zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.fac .val{font-family:var(--display);font-weight:700;font-size:1.05rem;text-align:right;font-variant-numeric:tabular-nums}
.fac .val.p{color:var(--pos)} .fac .val.n{color:var(--neg)}
.fac .body{padding:0 0 12px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.fac table{border-collapse:collapse;width:100%;font-size:.84rem}
.fac td{padding:3px 0;border-bottom:1px dashed var(--line)}
.fac td:last-child{text-align:right;font-variant-numeric:tabular-nums}

.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.kv b{font-family:var(--display);font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1}
.kv span{font-size:.74rem;color:var(--muted);font-weight:600}

.zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;aspect-ratio:3/2;border-radius:10px;overflow:hidden}
.zgrid div{display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--text);position:relative}

.tl{display:flex;flex-direction:column;gap:0}
.tl-r{display:grid;grid-template-columns:1fr 46px 1fr;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.tl-r:last-child{border-bottom:0}
.tl-r .m{font-family:var(--display);font-weight:700;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-r .l{text-align:right;display:flex;justify-content:flex-end;align-items:center;gap:6px}
.tl-r .rr{display:flex;align-items:center;gap:6px}
.ico{width:16px;height:16px;flex:none}
.ycard{width:10px;height:14px;border-radius:2px;background:#F2C14E;display:inline-block;flex:none}
.rcard{width:10px;height:14px;border-radius:2px;background:#E5484D;display:inline-block;flex:none}

.quiz{display:flex;flex-direction:column;gap:8px}
.quiz button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;cursor:pointer;font-weight:500;display:flex;gap:10px;align-items:flex-start}
.quiz button .k{font-family:var(--display);font-weight:700;color:var(--muted);min-width:16px}
.quiz button.ok{border-color:var(--pos);background:var(--pos-soft)}
.quiz button.no{border-color:var(--neg);background:var(--neg-soft)}

.prog{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}

.hero{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r);background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--line);position:relative;overflow:hidden}
.hero h1{font-size:1.65rem}
.hero .lines{position:absolute;right:-30px;top:-30px;width:170px;opacity:.45;pointer-events:none}

/* folha (bottom sheet) */
.scrim{position:fixed;inset:0;background:rgba(3,8,14,.55);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:680px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;border:1px solid var(--line);max-height:88%;display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 12px 8px 18px;border-bottom:1px solid var(--line)}
.sheet-b{overflow-y:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.ans{font-size:.98rem;display:flex;flex-direction:column;gap:8px}
.ans ul{margin:0;padding-left:20px}
.ask-row{display:flex;gap:8px}
.ask-row textarea{flex:1;min-height:46px;max-height:140px;resize:vertical;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px 12px;font-size:1rem}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;display:none;max-width:90%}
.toast.on{display:block}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:.92rem}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.fb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;gap:2px}
.pbar span{display:block;height:100%}
.tlink{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-decoration-color:var(--accent);text-underline-offset:3px;cursor:help}
.tlink:hover{color:var(--accent)}
.diag-dot{transition:transform 1.4s cubic-bezier(.4,0,.2,1)}
.diag-arrow{stroke-dasharray:var(--len);stroke-dashoffset:0}
.anim .diag-arrow{animation:draw 1.2s ease forwards;stroke-dashoffset:var(--len)}
@keyframes draw{to{stroke-dashoffset:0}}
.reduce *,.reduce *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:720px){main{padding-top:22px} h1{font-size:2.1rem}}
@media (max-width:380px){.kv b{font-size:1.25rem} .board .s{font-size:2.4rem} .fac summary{grid-template-columns:1fr 90px 42px}}
</style>
</head>

<body>
<div class="shell">
  <header class="top">
    <div class="top-in" id="topbar">
      <a class="brand" href="#inicio" aria-label="FOOTBALL IQ, início"><span class="brand-mark">IQ</span><span>FOOTBALL <b>IQ</b></span></a>
      <span class="spacer"></span>
    </div>
  </header>
  <main id="view" aria-live="polite">
    <div class="skel"></div><div class="skel"></div>
  </main>
</div>
<nav class="nav" aria-label="Navegação principal">
  <div class="nav-in" id="nav"></div>
</nav>
<button class="fab" id="fab" type="button" aria-haspopup="dialog"></button>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-h"><h2 id="sheet-title" class="grow">Perguntar</h2><button class="iconbtn" type="button" data-act="close-sheet" aria-label="Fechar"></button></div>
  <div class="sheet-b" id="sheet-body"></div>
</section>
<div class="toast" id="toast" role="status"></div>
<script>

'use strict';
/* ============================== núcleo ============================== */
const I = {
  home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  pitch:'<rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.5"/><path d="M3 9h3v6H3M21 9h-3v6h3"/>',
  shirt:'<path d="M8 3 4 5.5 2.5 10l3 1.5V21h13v-9.5l3-1.5L20 5.5 16 3c-.5 1.7-2 2.8-4 2.8S8.5 4.7 8 3z"/>',
  book:'<path d="M3 5.5C5.5 4 9 4 12 6c3-2 6.5-2 9-.5V19c-2.5-1.5-6-1.5-9 .5-3-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/>',
  user:'<circle cx="12" cy="8.5" r="4"/><path d="M4 20.5c1.5-3.8 4.5-5.5 8-5.5s6.5 1.7 8 5.5"/>',
  ask:'<path d="M4 5h16v11H9l-5 4z"/><path d="M10 9.2a2 2 0 1 1 2.6 1.9c-.4.1-.6.5-.6.9v.3"/><path d="M12 14.4v.1"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  play:'<path d="M8 5.5v13l10.5-6.5z"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  ball:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.6l3.1 2.3-1.2 3.7h-3.8l-1.2-3.7z"/>',
  pass:'<path d="M4 17c4-6 9-8.5 15-8.5"/><path d="M15.5 5l3.5 3.5-3.5 3.5"/>',
  sub:'<path d="M7 4v14M3.5 14.5 7 18l3.5-3.5M17 20V6M13.5 9.5 17 6l3.5 3.5"/>',
  compare:'<path d="M8 4v16M16 4v16M4 8h8M12 16h8"/>',
  thumb:'<path d="M7 11v9H4v-9zM7 11l4-7c1.5 0 2.3 1 2 2.5L12.5 10H19a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/>',
  confused:'<circle cx="12" cy="12" r="9"/><path d="M9 9.5h.01M15 9.5h.01M8.5 15.5c2-1.3 5-1.3 7 0"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  bookmark:'<path d="M6 3.5h12V21l-6-4-6 4z"/>',
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
};
const ic = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n] || ''}</svg>`;

const STORE_KEY = 'fiq.v1';
const DEFAULTS = {
  onboarded: false, intro: false, level: 'int', role: null, pos: null, favTeams: [], favPlayers: [], comp: 'can2023',
  topics: [], notif: { analysis: true, learn: true, player: false, freq: 'semanal' }, theme: 'dark', textScale: 1,
  reduceMotion: false, done: {}, quiz: {}, saved: [], last: null, fb: {}
};
const clone = o => JSON.parse(JSON.stringify(o));
function loadState() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return Object.assign(clone(DEFAULTS), JSON.parse(raw)); } catch (e) { }
  return clone(DEFAULTS);
}
let S = loadState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } }

/* ---------- dados ---------- */
const D = { ix: null, det: null, m: {}, team: {}, pl: {}, match: {}, comp: {}, byTeam: {} };
async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error('Não foi possível carregar ' + url + ' (' + r.status + ')'); return r.json(); }
async function loadIndex() {
  const ix = await getJSON('data/index.json');
  D.ix = ix;
  ix.comps.forEach(c => D.comp[c.key] = c);
  ix.teams.forEach(t => D.team[t.comp + '|' + t.code] = t);
  ix.players.forEach(p => D.pl[p.comp + '|' + p.id] = p);
  ix.matches.forEach(m => {
    D.match[m.id] = m;
    for (const c of [m.h, m.a]) (D.byTeam[m.comp + '|' + c] = D.byTeam[m.comp + '|' + c] || []).push(m);
  });
}
function loadMatch(id) { if (!D.m[id]) D.m[id] = getJSON('data/m/' + id + '.json').catch(e => { delete D.m[id]; throw e; }); return D.m[id]; }
function loadDetail() { if (!D.detP) D.detP = getJSON('data/players.json').then(d => (D.det = d)).catch(e => { D.detP = null; throw e; }); return D.detP; }
const det = (comp, id) => D.det && D.det[comp + '|' + id];

/* ---------- utilitários ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (v, d = 1) => (v == null || Number.isNaN(+v)) ? '–' : (+v).toFixed(d).replace('.', ',');
const fint = v => v == null ? '–' : Math.round(v).toLocaleString('pt-PT');
const sgn = (v, d = 1) => (Math.abs(v) < 0.05 && d === 1 ? '±' : v > 0 ? '+' : '−') + fmt(Math.abs(v), d);
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const fdate = d => { const [y, m, dd] = d.split('-'); return `${+dd} ${MES[m - 1]} ${y}`; };
const fday = d => { try { return new Date(d + 'T12:00:00').toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { return fdate(d); } };
const tm = (comp, code) => D.team[comp + '|' + code] || { name: code, code, color: '#777', fg: '#fff' };
const tname = (comp, code) => tm(comp, code).name;
const tchip = (comp, code) => { const t = tm(comp, code); return `<span class="tchip" style="background:${t.color};color:${t.fg}" title="${esc(t.name)}">${t.code}</span>`; };
const pl = (comp, id) => D.pl[comp + '|' + id];
const pname = (comp, id) => (pl(comp, id) || {}).n || '—';
const rband = r => r == null ? 0 : r >= 7.5 ? 5 : r >= 7 ? 4 : r >= 6 ? 3 : r >= 5.5 ? 2 : 1;
const RBL = ['sem nota', 'fraco', 'abaixo do habitual', 'normal', 'muito bom', 'excelente'];
const rbadge = (r, big = false) => `<span class="rt b${rband(r)}${big ? ' big' : ''}" role="img" aria-label="Nota ${r == null ? 'não atribuída' : fmt(r)}: ${RBL[rband(r)]}">${r == null ? 's/n' : fmt(r)}</span>`;
const GRP = g => (D.ix.meta.groups[g] || '—');
const GRP_PL = { GK: 'guarda-redes', CB: 'defesas centrais', FB: 'laterais e alas', DM: 'médios defensivos', CM: 'médios centro', AM: 'médios ofensivos', W: 'extremos e médios ala', ST: 'avançados' };
const GRP_ONE = { GK: 'guarda-redes', CB: 'defesa central', FB: 'lateral', DM: 'médio defensivo', CM: 'médio centro', AM: 'médio ofensivo', W: 'extremo', ST: 'avançado' };
const POSL = id => (D.ix.meta.pos[id] || [])[1] || '—';
const POSS = id => (D.ix.meta.pos[id] || [])[0] || '';
const L = o => (o[S.level] !== undefined ? o[S.level] : (S.level === 'adv' && o.int !== undefined ? o.int : o.ini));
const TAGN = { f: 'Facto', e: 'Estimativa', i: 'Interpretação', h: 'Hipótese' };
const tag = k => `<span class="tag ${k}">${TAGN[k]}</span>`;
const compName = k => (D.comp[k] || {}).name || k;
const LEVELS = { ini: 'Principiante', int: 'Intermédio', adv: 'Avançado' };
const score = m => `${m.hg}–${m.ag}`;
const minsTxt = v => `${Math.round(v)}'`;
function matchLabel(m) { return `${tname(m.comp, m.h)} ${m.hg}–${m.ag} ${tname(m.comp, m.a)}`; }
function winnerSide(m) { if (m.hg > m.ag) return 'h'; if (m.ag > m.hg) return 'a'; if (m.pens) return m.pens[0] > m.pens[1] ? 'h' : 'a'; return null; }
const V = document.getElementById('view');
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600); }
function errBox(e) { return `<div class="card"><h2>Algo correu mal</h2><p class="muted">${esc(e.message || e)}</p><p class="small">Tenta recarregar a página. Se continuar, os ficheiros de dados podem não estar disponíveis.</p><a class="btn" href="#inicio">Voltar ao início</a></div>`; }

/* ---------- aparência ---------- */
function applyLook() {
  document.documentElement.dataset.app = S.theme || 'dark';
  document.documentElement.style.setProperty('--fs', (16 * (S.textScale || 1)) + 'px');
  document.body.classList.toggle('reduce', !!S.reduceMotion);
}

/* ---------- navegação ---------- */
const TABS = [['inicio', 'Início', 'home'], ['jogos', 'Jogos', 'pitch'], ['jogadores', 'Jogadores', 'shirt'], ['aprender', 'Aprender', 'book'], ['perfil', 'Perfil', 'user']];
function renderNav(active) {
  $('#nav').innerHTML = TABS.map(([k, l, i]) => `<a href="#${k}"${k === active ? ' aria-current="page"' : ''}>${ic(i)}<span>${l}</span></a>`).join('');
}
function setTop(opts = {}) {
  const lvl = `<button class="lvl" type="button" data-act="level" aria-label="Nível de explicação: ${LEVELS[S.level]}. Mudar">Nível <i>${LEVELS[S.level]}</i></button>`;
  if (opts.title) {
    $('#topbar').innerHTML = `<button class="iconbtn" type="button" data-act="back" aria-label="Voltar">${ic('back')}</button><div class="top-title">${esc(opts.title)}</div>${lvl}`;
  } else {
    $('#topbar').innerHTML = `<a class="brand" href="#inicio" aria-label="FOOTBALL IQ, início"><span class="brand-mark">IQ</span><span>FOOTBALL <b>IQ</b></span></a><span class="spacer"></span>${lvl}`;
  }
}
const CUR = { tab: 'inicio', ctx: null, view: '' };
const ROUTES = [
  [/^inicio$/, 'inicio', () => viewHome()],
  [/^jogos$/, 'jogos', () => viewMatches()],
  [/^jogo-(\d+)$/, 'jogos', m => viewMatch(+m[1])],
  [/^agora$/, 'jogos', () => viewLive()],
  [/^ao-vivo-(\d+)$/, 'jogos', m => viewLiveMatch(m[1])],
  [/^jogadores$/, 'jogadores', () => viewPlayers()],
  [/^jogador-([a-z0-9]+)-(\d+)$/, 'jogadores', m => viewPlayer(m[1], +m[2])],
  [/^analise-(\d+)-(\d+)$/, null, m => viewPM(+m[1], +m[2])],
  [/^comparar-([a-z0-9]+)-(\d+)-(\d+)$/, 'jogadores', m => viewCompare(m[1], +m[2], +m[3])],
  [/^aprender$/, 'aprender', () => viewLearn()],
  [/^modulo-([a-z]+)$/, 'aprender', m => viewModule(m[1])],
  [/^glossario$/, 'aprender', () => viewGlossary()],
  [/^perfil$/, 'perfil', () => viewProfile()],

/* mapa de calor de acções (eventos) */
function heatRects(points, nx = 24, ny = 16, sigma = 1.15) {
  if (!points.length) return '';
  const g = new Float32Array(nx * ny);
  for (const [x, y] of points) {
    const i = Math.min(nx - 1, Math.max(0, Math.floor(x / 120 * nx))), j = Math.min(ny - 1, Math.max(0, Math.floor(y / 80 * ny)));
    g[j * nx + i] += 1;
  }
  const k = []; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) k.push([dx, dy, Math.exp(-(dx * dx + dy * dy) / (2 * sigma * sigma))]);
  const s = new Float32Array(nx * ny); let max = 0;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    let v = 0; for (const [dx, dy, w] of k) { const a = i + dx, b = j + dy; if (a >= 0 && a < nx && b >= 0 && b < ny) v += g[b * nx + a] * w; }
    s[j * nx + i] = v; if (v > max) max = v;
  }
  const cw = 120 / nx, ch = 80 / ny; let out = '';
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const v = s[j * nx + i] / max; if (v < 0.07) continue;
    out += `<rect x="${(i * cw).toFixed(2)}" y="${(j * ch).toFixed(2)}" width="${(cw + .06).toFixed(2)}" height="${(ch + .06).toFixed(2)}" style="fill:rgba(var(--heat),${(0.06 + 0.8 * v * v).toFixed(3)})"/>`;
  }
  return out;
}
function heatLegend() {
  return `<div class="legend"><span>menos acções</span><span style="display:inline-block;width:90px;height:9px;border-radius:5px;background:linear-gradient(90deg,rgba(var(--heat),.06),rgba(var(--heat),.86))"></span><span>mais acções</span></div>`;
}
function heatFig(points, label, note) {
  return `<div class="fig">${pitchSVG(`<g>${heatRects(points)}</g>` + pitchOverlayLines(), label)}${dirNote()}${heatLegend()}${note ? `<p class="caption">${note}</p>` : ''}</div>`;
}
const pitchOverlayLines = () => `<g class="pl" style="opacity:.75"><line x1="60" y1="0" x2="60" y2="80"/><rect x="102" y="18" width="18" height="44"/><rect x="0" y="18" width="18" height="44"/></g>`;

/* zonas 3×3: terços × corredores */
function zoneGrid(z, title = 'Distribuição das acções por zona') {
  const max = Math.max(1, ...z);
  let cells = '';
  for (let c = 0; c < 3; c++) for (let t = 0; t < 3; t++) {
    const v = z[t * 3 + c];
    cells += `<div style="background:color-mix(in srgb, rgba(var(--heat),1) ${Math.round(8 + 70 * v / max)}%, var(--pitch))">${v}%</div>`;
  }
  return `<div class="fig"><div class="zgrid" role="img" aria-label="${esc(title)}: ${zoneSummaryText(z)}">${cells}</div>
  <div class="row xs muted" style="justify-content:space-between"><span>Defesa</span><span>Meio-campo</span><span>Ataque →</span></div>
  <p class="caption">Linhas: corredor esquerdo (em cima), central e direito (em baixo), do ponto de vista de quem ataca.</p></div>`;
}
function zoneSummaryText(z) {
  const thirds = [0, 1, 2].map(t => z[t * 3] + z[t * 3 + 1] + z[t * 3 + 2]);
  const lanes = [0, 1, 2].map(c => z[c] + z[3 + c] + z[6 + c]);
  const tn = ['no terço defensivo', 'no meio-campo', 'no terço ofensivo'], ln = ['no corredor esquerdo', 'no corredor central', 'no corredor direito'];
  const ti = thirds.indexOf(Math.max(...thirds)), li = lanes.indexOf(Math.max(...lanes));
  return `${lanes[li]}% das acções ${ln[li]} e ${thirds[ti]}% ${tn[ti]}`;
}

/* mapa de remates de um jogo (casa ataca para a direita, fora para a esquerda) */
function shotMap(mo, onlySide) {
  const S = mo.ev.S;

  S.forEach((s, k) => {
    const p = mo.pl[s[0]]; if (!p) return;

    let x = s[1], y = s[2];

    const r = (1.1 + 4.4 * Math.sqrt(s[3])).toFixed(2), col = p.sd === 'h' ? 'var(--home)' : 'var(--away)';
    const goal = s[4] === 'G';
    g += `<circle cx="${x}" cy="${y}" r="${r}" data-act="shot" data-k="${k}" style="cursor:pointer;fill:${goal ? col : 'transparent'};stroke:${goal ? 'var(--text)' : col};stroke-width:${goal ? .5 : .6};fill-opacity:${goal ? .95 : 0};${s[4] === 'B' ? 'stroke-dasharray:.8 .6;' : ''}"><title>${esc(p.n)} ${s[5] + 1}' — xG ${fmt(s[3], 2)} — ${SHOT_OUT[s[4]]}</title></circle>`;
  });
  const lab = `${mo.ev.S.length} remates`;
  return `<div class="fig">${pitchSVG(g, 'Mapa de remates: ' + lab)}
  <div class="legend"><span><span class="sw" style="background:var(--home)"></span>${tname(mo.comp, mo.h.t)} ataca →</span><span>← ${tname(mo.comp, mo.a.t)} ataca <span class="sw" style="background:var(--away)"></span></span></div>
  <div class="legend"><span><svg width="14" height="14"><circle cx="7" cy="7" r="5.5" style="fill:var(--muted);stroke:var(--text)"/></svg>golo</span><span><svg width="14" height="14"><circle cx="7" cy="7" r="5.5" style="fill:none;stroke:var(--muted);stroke-width:1.4"/></svg>sem golo</span><span><svg width="14" height="14"><circle cx="7" cy="7" r="5.5" style="fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:2 2"/></svg>bloqueado</span><span>tamanho = xG</span></div>
  <p class="caption" id="shot-cap">Toca num remate para ver quem rematou, o minuto e o xG.</p></div>`;
}

/* mapa de passes de um jogador */
function passMap(mo, pi, filter = 'todos') {
  const id = uid('pm');
  let g = '', n = 0;
  for (const r of mo.ev.P) {
    if (r[0] !== pi) continue;
    const ok = r[5] & 1, prog = r[5] & 2, kp = r[5] & 4;
    if (filter === 'prog' && !prog) continue;
    if (filter === 'kp' && !kp) continue;
    if (filter === 'falha' && ok) continue;
    n++;
    const col = kp ? 'var(--text)' : prog ? 'var(--accent)' : ok ? 'var(--info)' : 'var(--neg)';
    const mk = kp ? 't' : prog ? 'a' : ok ? 'i' : 'n';
    g += `<line x1="${r[1]}" y1="${r[2]}" x2="${r[3]}" y2="${r[4]}" style="stroke:${col};stroke-width:${prog || kp ? .75 : .5};opacity:${ok ? .95 : .75};${ok ? '' : 'stroke-dasharray:1.2 .8'}" marker-end="url(#${id}-${mk})"/>`;
  }
  return { svg: pitchSVG(g, `Mapa de passes: ${n} passes`, arrowDefs(id)), n };
}
function passLegend() {

}
/* receções (onde recebeu a bola) */
function receptionMap(mo, pi) {

/* acções defensivas */
const DTYPE = { 1: 'desarme', 2: 'interceção', 3: 'bloqueio', 4: 'alívio', 5: 'recuperação', 6: 'duelo aéreo', 7: 'falta', 8: 'driblado', 10: 'saída do GR' };
function defMap(mo, pi, withPress = true) {

/* pontos de acção de um jogador num jogo (para o mapa de calor) */
function playerPoints(mo, pi) {
  const pts = [];
  for (const r of mo.ev.P) { if (r[0] === pi) pts.push([r[1], r[2]]); if (r[7] === pi) pts.push([r[3], r[4]]); }
  for (const r of mo.ev.C) if (r[0] === pi) pts.push([r[1], r[2]], [r[3], r[4]]);

function teamPoints(mo, sd) {

  for (const r of mo.ev.P) if (ids.has(r[0])) pts.push([r[1], r[2]]);

}
/* rede de passes */
function passNetwork(mo, sd) {
  const net = mo.net[sd]; if (!net || !net.nodes.length) return '<p class="empty">Sem dados suficientes para a rede de passes.</p>';
  const col = sd === 'h' ? 'var(--home)' : 'var(--away)';
  const pos = {}; net.nodes.forEach(n => pos[n[0]] = n);
  const maxE = Math.max(...net.edges.map(e => e[2]), 1);
  let g = '';
  for (const [a, b, n] of net.edges.sort((x, y) => x[2] - y[2])) {
    if (!pos[a] || !pos[b]) continue;
    g += `<line x1="${pos[a][1]}" y1="${pos[a][2]}" x2="${pos[b][1]}" y2="${pos[b][2]}" style="stroke:${col};stroke-width:${(.3 + 2.2 * n / maxE).toFixed(2)};opacity:${(.25 + .6 * n / maxE).toFixed(2)};stroke-linecap:round"><title>${esc(mo.pl[a].n)} ↔ ${esc(mo.pl[b].n)}: ${n} passes</title></line>`;
  }
  for (const [i, x, y, n] of net.nodes) {
    const p = mo.pl[i], r = Math.min(5.2, 2.4 + Math.sqrt(n) * .3);
    g += `<g><title>${esc(p.n)}: ${n} acções de passe</title><circle cx="${x}" cy="${y}" r="${r.toFixed(2)}" style="fill:${col};stroke:var(--pitch);stroke-width:.6"/><text x="${x}" y="${y + 1.1}" text-anchor="middle" style="font:700 3.1px var(--body);fill:#06121d">${p.num}</text></g>`;
  }

  return `<div class="fig">${pitchSVG(g, 'Rede de passes de ' + tname(mo.comp, mo[sd].t))}${dirNote()}
  <p class="caption">Cada círculo é a posição média do jogador nos passes que fez e recebeu, até à primeira substituição${net.until ? ' (' + net.until + ')' : ''}. Linhas mais grossas = mais passes entre os dois (mínimo 3).</p>
  <div class="legend">${names}</div></div>`;
}
/* corrida de xG */
function xgRace(mo) {
  const W = 340, H = 180, P = { l: 30, r: 66, t: 14, b: 24 };
  const ev = mo.ev.S.map(s => ({ sd: mo.pl[s[0]].sd, t: (s[7] >= 3 ? s[5] : s[5]) + s[6] / 60, xg: s[3], g: s[4] === 'G', per: s[7] })).sort((a, b) => a.t - b.t);
  const og = mo.tl.filter(t => t.k === 'og');
  const maxT = Math.max(mo.et ? 120 : 90, ...ev.map(e => e.t + 1));
  const tot = { h: 0, a: 0 }; ev.forEach(e => tot[e.sd] += e.xg);
  const maxY = Math.max(1, Math.ceil(Math.max(tot.h, tot.a) * 2) / 2);
  const X = t => P.l + (W - P.l - P.r) * t / maxT, Y = v => H - P.b - (H - P.t - P.b) * v / maxY;
  let g = '';
  for (let v = 0; v <= maxY + 1e-9; v += maxY > 2 ? 1 : .5) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line);stroke-width:1"/><text class="ax" x="${P.l - 5}" y="${Y(v) + 3}" text-anchor="end">${fmt(v, 1)}</text>`;
  for (const t of [0, 45, 90].concat(mo.et ? [120] : [])) g += `<text class="ax" x="${X(t)}" y="${H - 8}" text-anchor="middle">${t}'</text>`;
  g += `<line x1="${X(45)}" x2="${X(45)}" y1="${P.t}" y2="${H - P.b}" style="stroke:var(--line);stroke-dasharray:3 3"/>`;
  for (const sd of ['h', 'a']) {
    let cum = 0, d = `M${X(0)} ${Y(0)}`; const goals = [];
    for (const e of ev.filter(e => e.sd === sd)) { d += ` H${X(e.t).toFixed(1)}`; cum += e.xg; d += ` V${Y(cum).toFixed(1)}`; if (e.g) goals.push([e.t, cum]); }
    d += ` H${X(maxT).toFixed(1)}`;
    const col = sd === 'h' ? 'var(--home)' : 'var(--away)';
    g += `<path d="${d}" style="fill:none;stroke:${col};stroke-width:2.2;stroke-linejoin:round"/>`;
    goals.forEach(([t, v]) => g += `<circle cx="${X(t)}" cy="${Y(v)}" r="4.2" style="fill:${col};stroke:var(--surface);stroke-width:1.5"/>`);
    g += `<text x="${W - P.r + 5}" y="${Y(cum) + 4}" style="font:700 12px var(--display);fill:${col}">${tm(mo.comp, mo[sd].t).code} ${fmt(cum, 2)}</text>`;
  }
  const lbl = `Golos esperados acumulados: ${tname(mo.comp, mo.h.t)} ${fmt(tot.h, 2)}, ${tname(mo.comp, mo.a.t)} ${fmt(tot.a, 2)}`;
  return `<div class="fig"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(lbl)}">${g}</svg>
  <div class="legend"><span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5" style="fill:var(--muted)"/></svg>golo</span>${og.length ? '<span>autogolos não aparecem: não são remates</span>' : ''}</div></div>`;
}
/* xG por períodos de 15' */
function xgBuckets(mo) {
  const lab = ['0–15', '15–30', '30–45+', '45–60', '60–75', '75–90+', 'Prol.'];
  const h = mo.ts.h.xg_bk, a = mo.ts.a.xg_bk, n = mo.et ? 7 : 6;
  const W = 340, H = 150, P = { l: 26, r: 6, t: 10, b: 30 }, max = Math.max(.5, ...h.slice(0, n), ...a.slice(0, n));
  const bw = (W - P.l - P.r) / n, Y = v => (H - P.t - P.b) * v / max;
  let g = `<line x1="${P.l}" x2="${W - P.r}" y1="${H - P.b}" y2="${H - P.b}" style="stroke:var(--line)"/>`;
  for (let i = 0; i < n; i++) {
    const x = P.l + i * bw + bw * .14, w = bw * .34;
    g += `<rect x="${x}" y="${H - P.b - Y(h[i])}" width="${w}" height="${Y(h[i])}" rx="2" style="fill:var(--home)"><title>${tm(mo.comp, mo.h.t).code}: ${fmt(h[i], 2)} xG</title></rect>`;
    g += `<rect x="${x + w + 2}" y="${H - P.b - Y(a[i])}" width="${w}" height="${Y(a[i])}" rx="2" style="fill:var(--away)"><title>${tm(mo.comp, mo.a.t).code}: ${fmt(a[i], 2)} xG</title></rect>`;
    g += `<text class="ax" x="${P.l + i * bw + bw / 2}" y="${H - 14}" text-anchor="middle">${lab[i]}</text>`;
    const top = Math.max(h[i], a[i]);
    if (top >= .3) g += `<text class="ax" x="${P.l + i * bw + bw / 2}" y="${H - P.b - Y(top) - 3}" text-anchor="middle" style="font-weight:700;fill:var(--text)">${fmt(top, 1)}</text>`;
  }
  return `<div class="fig"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Golos esperados por período de 15 minutos">${g}</svg>
  <div class="legend"><span><span class="sw" style="background:var(--home)"></span>${tname(mo.comp, mo.h.t)}</span><span><span class="sw" style="background:var(--away)"></span>${tname(mo.comp, mo.a.t)}</span><span>minutos</span></div></div>`;
}
/* entradas no último terço por corredor */
function lanesFig(mo) {
  const row = sd => {
    const e = mo.ts[sd].entries, t = e[0] + e[1] + e[2] || 1, col = sd === 'h' ? 'var(--home)' : 'var(--away)';
    const names = ['Esquerda', 'Meio', 'Direita'];
    return `<div class="col" style="gap:5px"><div class="row small"><b>${tname(mo.comp, mo[sd].t)}</b><span class="muted">${t} entradas</span></div>
    ${[0, 1, 2].map(i => `<div class="row small" style="gap:8px"><span style="width:62px" class="muted">${names[i]}</span><span class="grow pct-track" style="height:10px"><span class="pct-fill" style="width:${Math.round(100 * e[i] / t)}%;background:${col}"></span></span><b class="num" style="width:38px;text-align:right">${Math.round(100 * e[i] / t)}%</b></div>`).join('')}</div>`;
  };
  return `<div class="col" style="gap:14px">${row('h')}${row('a')}<p class="caption">Entradas no último terço (passes certos e conduções), pelo corredor onde a bola chegou. Esquerda e direita do ponto de vista de quem ataca.</p></div>`;
}
/* barras de comparação de equipa */
function cmpRow(label, hv, av, d = 0, suffix = '', invert = false) {
  const t = (hv || 0) + (av || 0) || 1;
  const hp = Math.max(2, 100 * (hv || 0) / t), ap = Math.max(2, 100 * (av || 0) / t);
  const hb = invert ? hv < av : hv > av, ab = invert ? av < hv : av > hv;
  return `<div class="cmp-r"><span class="v" style="${hb ? '' : 'opacity:.75'}">${fmt(hv, d)}${suffix}</span><div class="mid"><span class="lab">${label}</span><div class="cmp-bar"><span class="h" style="width:${hp}%;opacity:${hb ? 1 : .45}"></span><span class="a" style="width:${ap}%;opacity:${ab ? 1 : .45}"></span></div></div><span class="v r" style="${ab ? '' : 'opacity:.75'}">${fmt(av, d)}${suffix}</span></div>`;
}
/* nota por jogo (tendência) */
function ratingTrend(rows, highlight) {
  const W = 340, H = 150, P = { l: 24, r: 6, t: 14, b: 30 }, n = rows.length;
  if (!n) return '';
  const lo = 4, hi = 10, Y = v => H - P.b - (H - P.t - P.b) * (v - lo) / (hi - lo);
  const bw = Math.min(46, (W - P.l - P.r) / n);
  let g = '';
  for (const v of [5, 6.5, 8, 10]) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line);${v === 6.5 ? 'stroke-dasharray:4 3;stroke:var(--muted)' : ''}"/><text class="ax" x="${P.l - 4}" y="${Y(v) + 3}" text-anchor="end">${fmt(v, v % 1 ? 1 : 0)}</text>`;
  rows.forEach((r, i) => {
    const x = P.l + i * bw + bw * .18, w = bw * .64;
    if (r.r == null) { g += `<text class="ax" x="${x + w / 2}" y="${Y(4.6)}" text-anchor="middle">s/n</text>`; }
    else {
      const colr = ['#9CC3F0', '#F2867D', '#F2C14E', '#9CC3F0', '#7FD16B', '#2FC48D'][rband(r.r)];
      g += `<rect x="${x}" y="${Y(r.r)}" width="${w}" height="${Y(lo) - Y(r.r)}" rx="3" style="fill:${colr};${highlight && r.mid !== highlight ? 'opacity:.45' : ''}"/>`;
      g += `<text x="${x + w / 2}" y="${Y(r.r) - 4}" text-anchor="middle" style="font:700 11px var(--display);fill:var(--text)">${fmt(r.r)}</text>`;
    }
    g += `<text class="ax" x="${x + w / 2}" y="${H - 15}" text-anchor="middle" style="font-weight:700">${r.opp}</text><text class="ax" x="${x + w / 2}" y="${H - 4}" text-anchor="middle">${r.min}'</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Nota por jogo: ${rows.map(r => r.opp + ' ' + (r.r == null ? 'sem nota' : fmt(r.r))).join(', ')}">${g}</svg>
  <p class="caption">Linha tracejada: 6,5, a referência de um jogador médio na mesma posição. Por baixo: adversário e minutos jogados.</p>`;
}
/* percentis */
function pctBars(rows) {
  return `<div class="pct">${rows.map(r => {
    const p = r.p, col = p >= 75 ? 'var(--pos)' : p <= 25 ? 'var(--neg)' : 'var(--info)';
    const word = p >= 90 ? 'topo 10%' : p >= 75 ? 'topo 25%' : p <= 10 ? 'últimos 10%' : p <= 25 ? 'últimos 25%' : 'zona média';
    return `<div class="pct-r"><div class="pct-top"><span>${esc(r.l)} <span class="muted xs">${r.v}</span></span><span><b>${p}</b> <span class="muted xs">· ${word}</span></span></div><div class="pct-track"><span class="pct-fill" style="width:${Math.max(3, p)}%;background:${col}"></span><span class="pct-mid"></span></div></div>`;
  }).join('')}</div>`;
}

/* ---------- diagramas de aprendizagem ---------- */
function diagram(spec, id) {
  const defs = arrowDefs(id);
  let g = '';
  for (const z of spec.zones || []) g += `<rect x="${z[0]}" y="${z[1]}" width="${z[2]}" height="${z[3]}" rx="1.5" style="fill:rgba(var(--heat),.18);stroke:var(--accent);stroke-width:.4;stroke-dasharray:1.5 1"/>${z[4] ? `<text x="${z[0] + z[2] / 2}" y="${z[1] + 4}" text-anchor="middle" style="font:700 3.2px var(--body);fill:var(--accent)">${esc(z[4])}</text>` : ''}`;
  for (const l of spec.lines || []) g += `<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" style="stroke:var(--away);stroke-width:.5;stroke-dasharray:2 1.2;opacity:.8"/>`;
  for (const a of spec.arrows || []) {
    const [x1, y1, x2, y2, kind] = a, len = Math.hypot(x2 - x1, y2 - y1).toFixed(1);
    const st = kind === 'pass' ? 'stroke:var(--text);stroke-width:.6' : kind === 'carry' ? 'stroke:var(--accent);stroke-width:.6;stroke-dasharray:.6 .9' : 'stroke:var(--accent);stroke-width:.7;stroke-dasharray:2 1.2';
    const mk = kind === 'pass' ? 't' : 'a';
    g += `<line class="diag-arrow" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="${st};--len:${len}" marker-end="url(#${id}-${mk})"/>`;
  }
  for (const p of spec.players || []) {
    const [t, x, y, lab, tx, ty] = p, col = t === 'a' ? 'var(--home)' : 'var(--away)';
    const mv = tx != null ? `data-tx="${tx - x}" data-ty="${ty - y}"` : '';
    g += `<g class="diag-dot" ${mv}><circle cx="${x}" cy="${y}" r="2.6" style="fill:${col};stroke:var(--pitch);stroke-width:.5"/>${lab ? `<text x="${x}" y="${y + 1.05}" text-anchor="middle" style="font:700 2.6px var(--body);fill:#06121d">${esc(lab)}</text>` : ''}</g>`;
  }
  if (spec.ball) g += `<circle cx="${spec.ball[0]}" cy="${spec.ball[1]}" r="1.1" style="fill:#fff;stroke:#111;stroke-width:.3"/>`;
  return `<svg viewBox="-3 -3 126 86" role="img" aria-label="${esc(spec.label || 'Diagrama tático')}" id="${id}"><defs>${defs}</defs>${pitchLines()}${g}</svg>`;
}
ACT.animate = el => {
  const svg = document.getElementById(el.dataset.for); if (!svg) return;
  const dots = $$('.diag-dot', svg);
  const moved = svg.classList.toggle('moved');
  if (S.reduceMotion) svg.classList.add('reduce-anim');
  dots.forEach(d => { if (d.dataset.tx) d.style.transform = moved ? `translate(${d.dataset.tx}px,${d.dataset.ty}px)` : ''; });
  svg.classList.remove('anim'); void svg.getBBox(); if (moved) svg.classList.add('anim');
  el.innerHTML = moved ? `${ic('back')} Voltar ao início` : `${ic('play')} Ver o movimento`;
};

/* contagens esperadas de uma acção para um jogador médio da mesma posição, nos mesmos minutos e posse */

/* ---------- narrativa do jogo ---------- */
function goalsBefore(mo, sd, uptoIdx) { return mo.tl.slice(0, uptoIdx).filter(t => ['goal', 'pen', 'og'].includes(t.k) && t.sd === sd).length; }
function matchStory(mo) {
  const c = mo.comp, H = tname(c, mo.h.t), A = tname(c, mo.a.t), hs = mo.ts.h, as = mo.ts.a, hg = mo.h.g, ag = mo.a.g;
  const nm = sd => sd === 'h' ? H : A, oth = sd => sd === 'h' ? 'a' : 'h';
  const what = [], why = [];
  const et = mo.et ? ' após prolongamento' : '';
  if (hg !== ag) { const w = hg > ag ? 'h' : 'a'; what.push(['f', `${nm(w)} venceu ${nm(oth(w))} por ${Math.max(hg, ag)}–${Math.min(hg, ag)}${et}.`]); }
  else if (mo.pens) { const w = mo.pens[0] > mo.pens[1] ? 'h' : 'a'; what.push(['f', `${H} e ${A} empataram ${hg}–${ag}${et}. ${nm(w)} venceu no desempate por penáltis (${Math.max(...mo.pens)}–${Math.min(...mo.pens)}).`]); }
  else what.push(['f', `${H} e ${A} empataram ${hg}–${ag}.`]);
  const goals = mo.tl.filter(t => ['goal', 'pen', 'og'].includes(t.k));
  if (goals.length) what.push(['f', 'Golos: ' + goals.map(g => `${g.m} ${plink(mo, g.p)}${g.k === 'pen' ? ' (pen.)' : g.k === 'og' ? ' (autogolo)' : ''}`).join(' · ') + '.']);
  /* posse e oportunidades */
  const posT = hs.poss >= as.poss ? 'h' : 'a', xgT = hs.xg >= as.xg ? 'h' : 'a';
  const posBal = Math.abs(hs.poss - as.poss) < 8, xgBal = Math.abs(hs.xg - as.xg) < 0.3;
  let pc = posBal ? L({ ini: 'A bola esteve dividida', int: `A posse foi equilibrada (${fmt(hs.poss, 0)}%–${fmt(as.poss, 0)}%)`, adv: `Posse equilibrada (${fmt(hs.poss, 0)}–${fmt(as.poss, 0)}% dos passes)` })
    : L({ ini: `${nm(posT)} teve mais bola`, int: `${nm(posT)} teve mais bola (${fmt(mo.ts[posT].poss, 0)}%)`, adv: `${nm(posT)} teve ${fmt(mo.ts[posT].poss, 0)}% da posse` });
  const nums = L({ ini: '', int: ` (golos esperados: ${fmt(hs.xg, 1)} contra ${fmt(as.xg, 1)})`, adv: ` (xG ${fmt(hs.xg, 2)}–${fmt(as.xg, 2)}; remates ${hs.shots}–${as.shots}, ${hs.sot}–${as.sot} enquadrados)` });
  let cc;
  if (xgBal) cc = ` e as oportunidades foram parecidas dos dois lados${nums}.`;
  else if (posBal) cc = `, mas ${nm(xgT)} criou as oportunidades mais claras${nums}.`;
  else if (xgT === posT) cc = ` e também criou mais perigo${nums}.`;
  else cc = `, mas foi ${nm(xgT)} quem criou as oportunidades mais claras${nums}.`;
  what.push(['e', pc + cc]);
  /* momentos-chave */
  const keys = [];
  const gIdx = mo.tl.map((t, i) => [t, i]).filter(([t]) => ['goal', 'pen', 'og'].includes(t.k));
  const late = gIdx.filter(([t]) => /^90\+|^120\+/.test(t.m));
  if (late.length) {
    const sd = late[late.length - 1][0].sd, n = late.filter(([t]) => t.sd === sd).length;
    const firstLate = late[0][1];
    const bh = goalsBefore(mo, 'h', firstLate), ba = goalsBefore(mo, 'a', firstLate);
    const before = bh === ba ? 'empate' : (bh > ba) === (sd === 'h') ? 'vitória' : 'derrota';
    const after = hg === ag ? 'empate' : (hg > ag) === (sd === 'h') ? 'vitória' : 'derrota';
    if (before !== after) keys.push(['i', `O jogo mudou nos descontos: ${nm(sd)} marcou ${n === 1 ? 'um golo' : n + ' golos'} depois dos 90' e transformou ${before === 'derrota' ? 'uma derrota' : 'um empate'} em ${after === 'vitória' ? 'vitória' : 'empate'}.`]);
  }
  let maxDef = { h: 0, a: 0 }, ch = 0, ca = 0;
  for (const [t] of gIdx) { if (t.sd === 'h') ch++; else ca++; maxDef.h = Math.max(maxDef.h, ca - ch); maxDef.a = Math.max(maxDef.a, ch - ca); }
  for (const sd of ['h', 'a']) {
    const fin = sd === 'h' ? hg - ag : ag - hg;
    if (maxDef[sd] >= 1 && fin >= 0 && !keys.length) keys.push(['i', `${nm(sd)} esteve a perder por ${maxDef[sd] === 1 ? 'um golo' : maxDef[sd] + ' golos'} e recuperou para ${fin > 0 ? 'vencer' : 'empatar'}.`]);
  }
  for (const t of mo.tl.filter(t => t.k === 'rc' || t.k === 'y2')) keys.push(['f', `Expulsão de ${plink(mo, t.p)} (${nm(t.sd)}) aos ${t.m}.`]);
  for (const t of mo.tl.filter(t => t.k === 'penmiss')) keys.push(['f', `${plink(mo, t.p)} falhou um penálti aos ${t.m}${t.saved ? ' (defesa do guarda-redes)' : ''}.`]);
  keys.slice(0, 3).forEach(k => what.push(k));
  /* melhores notas */
  const best = sd => mo.pl.filter(p => p.sd === sd && p.r != null).sort((a, b) => b.r - a.r)[0];
  const bh = best('h'), ba = best('a');
  if (bh && ba) what.push(['e', L({ ini: `Melhores em campo: ${plink(mo, bh.i)} (${nm('h')}) e ${plink(mo, ba.i)} (${nm('a')}).`, int: `Melhores notas: ${plink(mo, bh.i)} (${fmt(bh.r)}) e ${plink(mo, ba.i)} (${fmt(ba.r)}).`, adv: `Melhores notas FOOTBALL IQ: ${plink(mo, bh.i)} ${fmt(bh.r)} e ${plink(mo, ba.i)} ${fmt(ba.r)}.` })]);

  /* porquê */
  if (Math.abs(hs.tilt - 50) >= 10) {
    const sd = hs.tilt > 50 ? 'h' : 'a';
    why.push(['i', L({ ini: `${nm(sd)} passou mais tempo perto da baliza adversária e empurrou o adversário para trás.`, int: `${nm(sd)} jogou mais no meio-campo adversário: ${fmt(mo.ts[sd].tilt, 0)}% dos passes feitos no último terço foram seus (${gl('tilt', 'domínio territorial')}).`, adv: `Field tilt ${fmt(mo.ts[sd].tilt, 0)}% para ${nm(sd)} (${gl('tilt', 'domínio territorial')}).` })]);
  }
  if (hs.ppda && as.ppda) {
    const sd = hs.ppda < as.ppda ? 'h' : 'a', r = Math.max(hs.ppda, as.ppda) / Math.min(hs.ppda, as.ppda);
    if (r >= 1.35) why.push(['i', L({ ini: `${nm(sd)} foi buscar a bola mais à frente e com mais insistência.`, int: `${nm(sd)} pressionou com mais intensidade: deixava o adversário fazer ${fmt(mo.ts[sd].ppda, 1)} passes antes de tentar recuperar a bola, contra ${fmt(mo.ts[oth(sd)].ppda, 1)} do outro lado (${gl('ppda', 'PPDA')}).`, adv: `${gl('ppda', 'PPDA')} ${fmt(hs.ppda, 1)} (${mo.h.t}) vs ${fmt(as.ppda, 1)} (${mo.a.t}): pressão mais intensa de ${nm(sd)}. Atenção ao contexto do marcador.` })]);
  }
  const laneN = ['pela esquerda', 'pelo meio', 'pela direita'];
  for (const sd of ['h', 'a']) {
    const e = mo.ts[sd].entries, t = e[0] + e[1] + e[2];
    if (t < 15) continue;
    const i = e.indexOf(Math.max(...e)), p = Math.round(100 * e[i] / t);
    if (p >= 45) why.push(['f', L({ ini: `${nm(sd)} atacou sobretudo ${laneN[i]}.`, int: `${nm(sd)} entrou no último terço sobretudo ${laneN[i]} (${p}% das entradas).`, adv: `Entradas no último terço de ${nm(sd)}: ${Math.round(100 * e[0] / t)}% esq. · ${Math.round(100 * e[1] / t)}% meio · ${Math.round(100 * e[2] / t)}% dir. (n=${t}).` })]);
  }
  if (Math.abs(hs.shots - as.shots) >= 5) {
    const sd = hs.shots > as.shots ? 'h' : 'a', o = oth(sd);
    const q = mo.ts[sd].xg / Math.max(1, mo.ts[sd].shots), qo = mo.ts[o].xg / Math.max(1, mo.ts[o].shots);
    if (q < qo * 0.75) why.push(['e', L({ ini: `${nm(sd)} rematou mais vezes, mas quase sempre de longe ou com pouca qualidade.`, int: `${nm(sd)} rematou mais (${mo.ts[sd].shots} contra ${mo.ts[o].shots}), mas de posições piores: ${fmt(q, 2)} xG por remate contra ${fmt(qo, 2)}.`, adv: `Volume vs qualidade: ${nm(sd)} ${mo.ts[sd].shots} remates a ${fmt(q, 3)} xG/remate; ${nm(o)} ${mo.ts[o].shots} a ${fmt(qo, 3)}.` })]);
  }
  for (const sd of ['h', 'a']) {
    const g = mo[sd].g, x = mo.ts[sd].xg;
    if (g - x >= 0.9) why.push(['h', L({ ini: `${nm(sd)} marcou mais do que as oportunidades faziam prever. Pode ter sido mérito na finalização, um guarda-redes em mau dia ou alguma sorte.`, int: `${nm(sd)} marcou ${g} com ${fmt(x, 1)} de xG. Pode ser boa finalização, um guarda-redes em mau dia ou simples variância: um único jogo não chega para separar estas explicações.`, adv: `Sobre-rendimento de ${nm(sd)}: ${g} golos para ${fmt(x, 2)} xG (+${fmt(g - x, 2)}). Sem xG pós-remate não dá para atribuir a diferença à finalização.` })]);
    if (x - g >= 1.0) why.push(['h', L({ ini: `${nm(sd)} teve oportunidades para marcar mais do que marcou.`, int: `${nm(sd)} ficou abaixo do esperado: ${g} golo${g === 1 ? '' : 's'} com ${fmt(x, 1)} de xG. Finalização fraca, boas defesas ou azar: com um jogo, não é possível saber qual pesou mais.`, adv: `Sub-rendimento de ${nm(sd)}: ${g} para ${fmt(x, 2)} xG (−${fmt(x - g, 2)}).` })]);
  }
  const penGoals = goals.filter(g => g.k === 'pen').length;
  if (penGoals >= 2 && penGoals >= goals.length / 2) why.push(['i', `${penGoals} dos ${goals.length} golos foram de penálti: os lances na área pesaram mais do que as jogadas corridas.`]);
  const lab = ['entre o início e os 15', 'entre os 15 e os 30', 'entre os 30 e o intervalo', 'entre os 45 e os 60', 'entre os 60 e os 75', 'nos últimos 15 minutos', 'no prolongamento'];
  let bk = null;
  for (const sd of ['h', 'a']) mo.ts[sd].xg_bk.forEach((v, i) => { if (!bk || v > bk.v) bk = { sd, i, v }; });
  if (bk && bk.v >= 0.6) why.push(['e', L({ ini: `O período de maior perigo foi ${lab[bk.i]}, a favor de ${nm(bk.sd)}.`, int: `O período mais perigoso foi ${lab[bk.i]}${bk.i < 6 ? ' minutos' : ''}: ${nm(bk.sd)} somou ${fmt(bk.v, 1)} de xG.`, adv: `Pico de xG: ${nm(bk.sd)} ${fmt(bk.v, 2)} ${lab[bk.i]}${bk.i < 6 ? "'" : ''}.` })]);
  if (!why.length) why.push(['i', 'Não há um padrão dominante nos dados deste jogo: os indicadores das duas equipas ficaram próximos.']);

}
function plink(mo, i) { const p = mo.pl[i]; if (!p) return '—'; return `<a href="#analise-${mo.id}-${p.id}">${esc(p.n)}</a>`; }

/* destaques por equipa face à média do torneio */
function teamHighlights(mo, sd) {
  const T = D.ix.meta.tavg[mo.comp], ts = mo.ts[sd], o = mo.ts[sd === 'h' ? 'a' : 'h'];
  const row = { xg: ts.xg, xga: o.xg, sot: ts.sot, big_ch: ts.big_ch, box_entries: ts.box_entries, recov_f3: ts.recov_f3, prog_pass: ts.prog_pass, dispossessed: ts.dispossessed, passpct: ts.passes ? 100 * ts.passes_cmp / ts.passes : null };

  if (z('xg') >= 0.8) pos.push(`Criou muito perigo: ${fmt(row.xg, 2)} xG (média do torneio: ${av('xg')}).`);
  if (z('big_ch') >= 1) pos.push(`Teve ${row.big_ch} grandes oportunidades (média: ${fmt(T.big_ch[0], 1)}).`);
  if (z('box_entries') >= 0.8) pos.push(`Chegou muitas vezes à área: ${row.box_entries} entradas (média: ${av('box_entries')}).`);
  if (z('recov_f3') >= 0.8) pos.push(`Recuperou ${row.recov_f3} bolas no último terço, perto da baliza adversária (média: ${av('recov_f3')}).`);
  if (z('prog_pass') >= 0.8) pos.push(`Fez a bola avançar com passes: ${row.prog_pass} progressivos (média: ${av('prog_pass')}).`);
  if (z('xga') <= -0.8) pos.push(`Concedeu poucas oportunidades: ${fmt(row.xga, 2)} xG contra (média: ${av('xga')}).`);
  if (z('dispossessed') <= -0.8) pos.push(`Perdeu poucas bolas em disputa (${row.dispossessed}).`);
  if (z('xga') >= 0.8) neg.push(`Concedeu muitas oportunidades: ${fmt(row.xga, 2)} xG contra (média: ${av('xga')}).`);
  if (z('box_entries') <= -0.8) neg.push(`Chegou pouco à área adversária: ${row.box_entries} entradas (média: ${av('box_entries')}).`);
  if (z('xg') <= -0.8) neg.push(`Criou pouco perigo: ${fmt(row.xg, 2)} xG (média: ${av('xg')}).`);

/* ---------- textos de destaque ---------- */
function insightText(x) {
  const c = x.comp, m = D.match[x.mid];
  const res = m ? ` (${tname(c, m.h)} ${m.hg}–${m.ag} ${tname(c, m.a)})` : '';
  switch (x.k) {
    case 'press': {
      const lost = m && ((m.h === x.team && m.hg < m.ag) || (m.a === x.team && m.ag < m.hg));
      return { t: 'Pressão máxima', b: `${tname(c, x.team)} pressionou como nenhuma outra equipa: ${gl('ppda', 'PPDA')} de ${fmt(x.v, 1)} contra ${tname(c, x.opp)} (média do torneio: ${fmt(x.avg, 1)}).${lost ? ' E perdeu esse jogo: pressionar muito não garante o resultado.' : ''}`, mid: x.mid, sub: res };
    }
    case 'tilt': return { t: 'Domínio territorial', b: `${tname(c, x.team)} fez ${fmt(x.v, 0)}% dos passes do último terço frente a ${tname(c, x.opp)}.`, mid: x.mid, sub: res };
    case 'eff': return { t: 'Eficácia', b: `${tname(c, x.team)} marcou ${x.g} golos com ${fmt(x.xg, 2)} de xG contra ${tname(c, x.opp)}.`, mid: x.mid, sub: res };
    case 'unlucky': return { t: 'Oportunidades sem golo', b: `${tname(c, x.team)} criou ${fmt(x.xg, 2)} de xG contra ${tname(c, x.opp)} e não marcou.`, mid: x.mid, sub: res };
    case 'late': return { t: 'Reviravolta nos descontos', b: `${tname(c, x.team)} marcou ${x.n === 1 ? 'um golo' : x.n + ' golos'} depois dos 90' frente a ${tname(c, x.opp)} (${x.mins.join(', ')}).`, mid: x.mid, sub: res };
    case 'bigmiss': return { t: 'A oportunidade mais clara falhada', b: `${pname(c, x.pid)} (${tname(c, x.team)}) falhou uma oportunidade de ${fmt(x.xg, 2)} xG aos ${x.m} contra ${tname(c, x.opp)}.`, mid: x.mid, pid: x.pid, sub: res };
    case 'wonder': return { t: 'O golo mais improvável', b: `${pname(c, x.pid)} (${tname(c, x.team)}) marcou com ${fmt(x.xg, 3)} de xG aos ${x.m} contra ${tname(c, x.opp)}: menos de 1 em 50 remates assim dá golo.`, mid: x.mid, pid: x.pid, sub: res };
    case 'best': return { t: 'Melhor exibição', b: `${pname(c, x.pid)} (${tname(c, x.team)}) teve nota ${fmt(x.r)} contra ${tname(c, x.opp)}, a mais alta do ${compName(c)}.`, mid: x.mid, pid: x.pid, sub: res };
    case 'engine': return { t: 'Motor de progressão', b: `${pname(c, x.pid)} (${tname(c, x.team)}) fez ${fmt(x.v, 1)} passes e conduções progressivas por 90 minutos, o valor mais alto do ${compName(c)}.`, pid: x.pid, sub: '' };
  }
  return { t: '', b: '' };
}

/* ---------- papel tático ---------- */
const ROLE = {
  GK: 'Defende a baliza, organiza a defesa e, cada vez mais, participa na construção com os pés.',
  CB: 'Protege a zona à frente da baliza, ganha duelos e inicia a construção com passes.',
  FB: 'Defende o corredor lateral e dá largura ao ataque, subindo pela linha para cruzar ou combinar.',
  DM: 'Protege a defesa, recupera bolas e liga o jogo entre defesas e médios.',
  CM: 'Liga defesa e ataque: faz circular a bola, progride e ajuda a recuperar.',
  AM: 'Joga entre linhas: recebe perto da área, cria oportunidades e aparece para rematar.',
  W: 'Dá largura junto à linha ou procura o meio para criar e rematar; ataca o 1x1.',

function roleTags(p, d) {
  const t = [], pc = d.pct || {};
  const add = (k, s) => { if ((pc[k] || 0) >= 75) t.push(s); };
  add('npxg90', 'finalizador'); add('xa90', 'criador'); add('kp90', 'último passe'); add('drib90', 'forte no 1x1');
  add('cprog90', 'conduz a bola para a frente'); add('pprog90', 'passe vertical'); add('press90', 'pressiona muito');
  add('tklint90', 'ganha muitas bolas'); add('aer90', 'forte no ar'); add('passpct', 'seguro no passe'); add('recbox90', 'aparece na área');
  add('prev90', 'evita golos'); add('saves90', 'muitas defesas');
  if (['W', 'FB', 'AM'].includes(p.grp) && d.z) {
    const z = d.z, wide = (z[0] + z[2] + z[3] + z[5] + z[6] + z[8]) / Math.max(1, z.reduce((a, b) => a + b, 0));
    if (wide >= 0.8) t.push('joga muito aberto'); else if (wide <= 0.62) t.push('procura o corredor central');
  }
  if (d.ay != null && p.grp !== 'GK') { if (d.ay < 30) t.push('atua pelo lado esquerdo'); else if (d.ay > 50) t.push('atua pelo lado direito'); }
  return [...new Set(t)].slice(0, 5);
}

      const ids = new Set(); hits.slice(0, 6).forEach(p => { const d = det(c, p.id); if (d) d.ms.forEach(r => ids.add(r[0])); });
      byPlayer = ms.filter(m => ids.has(m.id));
      if (hits.length) note = `<p class="small muted">Jogos de ${hits.slice(0, 3).map(p => `<a href="#jogador-${c}-${p.id}">${esc(p.n)}</a>`).join(', ')}${hits.length > 3 ? ' e outros' : ''}.</p>`;
    }
    const set = new Set([...byTeam, ...byPlayer].map(m => m.id));
    ms = ms.filter(m => set.has(m.id));
  }
  ms.sort((a, b) => (b.date + b.ko).localeCompare(a.date + a.ko));
  if (!ms.length) { $('#mlist').innerHTML = note + '<p class="empty">Nenhum jogo encontrado com estes filtros.</p>'; return; }
  let html = note, lastDay = '';
  for (const m of ms) {
    if (m.date !== lastDay) { if (lastDay) html += '</div>'; html += `<div class="daygrp">${fday(m.date)}</div><div class="card tight" style="gap:0">`; lastDay = m.date; }
    html += `<div class="xs muted" style="padding:8px 4px 0">${esc(m.stage)}${m.group ? ' · Grupo ' + m.group : ''}</div>` + matchRow(m);
  }
  $('#mlist').innerHTML = html + '</div>';
}

function pmMoments(mo, p) {

}
function pmTeam(mo, p) {
  const team = mo.pl.filter(q => q.sd === p.sd);
  const sum = k => team.reduce((a, q) => a + (typeof k === 'function' ? k(q.s) : (q.s[k] || 0)), 0);
  const defk = s => (s.tackles_won || 0) + (s.int || 0) + (s.recov || 0) + (s.blocks || 0) + (s.clear || 0);
  const rows = [
    ['Acções progressivas', (p.s.prog_pass || 0) + (p.s.prog_carry || 0), sum(s => (s.prog_pass || 0) + (s.prog_carry || 0))],
    ['Passes para remate', p.s.key_passes || 0, sum('key_passes')],
    ['xG (oportunidades de remate)', p.s.xg || 0, sum('xg')],
    ['Acções defensivas', defk(p.s), sum(defk)],
    ['Pressões', p.s.press || 0, sum('press')],
  ].filter(r => r[2] > 0);
  const share = r => Math.round(100 * r[1] / r[2]);
  const lead = rows.slice().sort((a, b) => share(b) - share(a))[0];

    <div class="pct">${rows.map(r => `<div class="pct-r"><div class="pct-top"><span>${r[0]}</span><span><b>${share(r)}%</b> <span class="muted xs">${cnt(r[0].startsWith('xG') ? 'npxg' : 'x', r[1])} de ${cnt(r[0].startsWith('xG') ? 'npxg' : 'x', r[2])}</span></span></div><div class="pct-track"><span class="pct-fill" style="width:${Math.min(100, share(r))}%;background:var(--info)"></span><span class="pct-mid" style="left:${avgShare}%"></span></div></div>`).join('')}</div>
    <p class="caption">Traço vertical: a quota que teria se todos contribuíssem por igual pelo tempo em campo (${avgShare}% dos minutos da equipa).</p></div></section>`;

function mdLite(t) {
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n');
  let out = '', inList = false;
  for (const ln of lines) {
    const m = ln.match(/^\s*[-•*]\s+(.*)/);
    if (m) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${m[1]}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    if (ln.trim()) out += `<p>${ln.replace(/^Base:/, '<span class="xs muted"><b>Base:</b></span>')}</p>`;
  }
  return out + (inList ? '</ul>' : '');
}
async function ask(q) {

  const sample = await getSample();

  const used = [];

  const lvl = { ini: 'Principiante: linguagem simples, sem jargão, no máximo 120 palavras, poucos números.', int: 'Intermédio: explica os termos técnicos que usares, alguns números, no máximo 180 palavras.', adv: 'Avançado: métricas e definições exatas, no máximo 220 palavras.' }[S.level];
  const ci = ctxInfo();
  const prompt = `És o assistente de análise da app FOOTBALL IQ. Responde em português europeu.
Nível do utilizador — ${lvl}
Regras:
1. Usa apenas dados devolvidos pelas ferramentas (StatsBomb Open Data: CAN 2023 e Euro 2024) e o glossário. Se a pergunta pedir dados que não existem aqui (outras competições, jogos ao vivo, vídeo, posições contínuas dos jogadores), diz isso claramente e oferece o que é possível responder.
2. Distingue factos (eventos registados), estimativas (xG, xA, nota FOOTBALL IQ) e interpretações. Nunca inventes estatísticas, acontecimentos ou causas.
3. Uma estatística isolada não prova que um jogador é bom ou mau: dá contexto (posição, minutos, adversário, posse).
4. Não uses títulos. Listas curtas só se ajudarem.
5. Termina com uma linha que começa por "Base:" a indicar os jogos, jogadores ou dados usados.
Sobre a nota FOOTBALL IQ: começa em 6,5 (jogador médio da mesma posição no torneio) e soma contribuições por factor (golos e remates, criação, progressão com bola, movimento sem bola, circulação, defesa e pressão, perdas/erros/disciplina, guarda-redes, contexto do resultado), comparando o que o jogador fez com o esperado para a posição nos mesmos minutos, ajustado à posse. Sem nota abaixo de 20 minutos.
Também há dados actuais (Premier League e Liga dos Campeões 2026/27) só com resultados, estatísticas de equipa e próximos jogos: usa a ferramenta current_matches. Para esses jogos não existem notas de jogadores nem mapas; diz isso se perguntarem.
Ecrã aberto pelo utilizador: ${ci ? JSON.stringify(ci.data) : 'nenhum em particular'}.
Pergunta: ${q}`;
  try {
    ASK.ctrl = new AbortController();

    }
  } finally { ASK.busy = false; }
  const src = $('#ans-src');
  if (src) src.innerHTML = (used.length ? `<p class="xs muted"><b>Dados consultados:</b> ${[...new Set(used)].map(esc).join(' · ')}</p>` : '') + feedbackMini('pergunta');

function askTools(used) {

function relDay(iso) {
  const d = new Date(iso), now = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(d) - day(now)) / 864e5);
  const hh = d.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
  if (diff === 0) return `hoje, ${hh}`;
  if (diff === 1) return `amanhã, ${hh}`;

}

function liveStory(g) {
  const nm = sd => lname(g[sd]), oth = sd => sd === 'h' ? 'a' : 'h', S = g.ts, items = [];
  const goals = g.ev.filter(e => e[1] === 'g');
  const winner = g.hg > g.ag ? 'h' : g.ag > g.hg ? 'a' : null;
  if (winner) items.push(['f', `${nm(winner)} venceu ${nm(oth(winner))} por ${Math.max(g.hg, g.ag)}–${Math.min(g.hg, g.ag)}.`]);
  else items.push(['f', `${nm('h')} e ${nm('a')} empataram ${g.hg}–${g.ag}.`]);
  if (goals.length) items.push(['f', 'Golos: ' + goals.map(e => `${e[0]}' ${nm(e[2])}`).join(' · ') + '.']);
  for (const sd of ['h', 'a']) {
    const r = g.ev.find(e => e[1] === 'r' && e[2] === sd);
    if (r) items.push(['f', `${nm(sd)} jogou com dez desde os ${r[0]}' (vermelho direto).`]);
    else if (S[sd].yrc) items.push(['f', `${nm(sd)} teve um jogador expulso por acumulação de amarelos (esta fonte não indica o minuto).`]);
  }
  const pl = S.h.poss >= S.a.poss ? 'h' : 'a', po = oth(pl);
  let interp = 0;
  if (Math.abs(S.h.poss - S.a.poss) >= 10) {
    let t = L({ ini: `${nm(pl)} teve muito mais bola`, int: `${nm(pl)} teve ${S[pl].poss}% de posse`, adv: `Posse ${S[pl].poss}–${S[po].poss}% para ${nm(pl)}` });
    if (S[pl].shots > S[po].shots) t += ` e rematou mais (${S[pl].shots} contra ${S[po].shots})`;
    else if (S[pl].shots === S[po].shots) t += ` e os remates ficaram iguais (${S[pl].shots}–${S[po].shots})`;
    else t += `, mas foi ${nm(po)} quem rematou mais (${S[po].shots} contra ${S[pl].shots})`;
    if (winner === po) t += S[po].shots >= S[pl].shots ? `: ${nm(pl)} teve a bola, ${nm(po)} teve o perigo e ganhou.` : `. Mesmo assim, ganhou ${nm(po)}: ter a bola não chegou.`;
    else t += '.';
    items.push(['i', t]); interp++;
  }
  for (const sd of ['h', 'a']) {
    const s = S[sd];
    if (s.shots >= 12 && s.sot <= 2) { items.push(['i', `${nm(sd)} rematou ${s.shots} vezes, mas só ${s.sot} ${s.sot === 1 ? 'remate foi' : 'remates foram'} à baliza: muito volume e pouca pontaria, ou remates de longe.`]); interp++; }

    if (s.blk >= 7) { items.push(['i', `${nm(oth(sd))} bloqueou ${s.blk} remates de ${nm(sd)}: defendeu com muita gente perto da área.`]); interp++; }
  }
  for (const sd of ['h', 'a']) {
    const s = S[sd], gs = sd === 'h' ? g.hg : g.ag;
    if (gs > s.sot) items.push(['h', `${nm(sd)} marcou ${gs} golos com ${s.sot} ${s.sot === 1 ? 'remate enquadrado registado' : 'remates enquadrados registados'}. Um dos golos pode ter sido autogolo; esta fonte não diz quem marcou.`]);
    else if (gs >= 2 && s.sot > 0 && s.sot <= gs + 1) { items.push(['i', `${nm(sd)} foi eficaz: ${gs} golos em ${s.sot} remates enquadrados.`]); interp++; }
  }
  const fg = goals[0];
  if (fg && winner && goals.length === 1 && fg[0] <= 20) { items.push(['i', `O golo cedo (${fg[0]}') decidiu: ${nm(winner)} defendeu a vantagem o resto do jogo.`]); interp++; }
  const late = goals.filter(e => e[0] >= 85);
  if (late.length) items.push(['f', `${late.length > 1 ? 'Golos' : 'Golo'} na reta final: ${late.map(e => `${e[0]}' ${nm(e[2])}`).join(', ')}.`]);
  for (const sd of ['h', 'a']) if (S[sd].yc >= 5) items.push(['f', `${nm(sd)} viu ${S[sd].yc} cartões amarelos e fez ${S[sd].fouls} faltas.`]);
  if (Math.max(S.h.corners, S.a.corners) >= 10) { const sd = S.h.corners >= S.a.corners ? 'h' : 'a'; items.push(['f', `${nm(sd)} ganhou ${S[sd].corners} cantos (${nm(oth(sd))}: ${S[oth(sd)].corners}).`]); }
  if (!interp) items.push(['i', `Jogo equilibrado nos números: posse ${S.h.poss}–${S.a.poss}%, remates ${S.h.shots}–${S.a.shots}, enquadrados ${S.h.sot}–${S.a.sot}.`]);
  return items;
}
